<div class="modal-backdrop" *ngIf="isVisible">
  <div class="modal-card">
    <div class="modal-icon"></div>
    <h2>¿Sigues ahí?</h2>
    <p>Hemos notado que llevas un tiempo sin interactuar. Tu sesión ha expirado.</p>
    
    <div class="modal-actions">
      <button class="btn-secondary" (click)="close()">Cancelar</button>
      <button class="btn-primary" (click)="relogin()">Iniciar Sesión de Nuevo</button>
    </div>
  </div>
</div>
