<div class="modal-backdrop" *ngIf="isVisible">
  <div class="modal-card">
    <div class="modal-icon">⚠️</div>
    <h2>Su sesión ha expirado</h2>
    <p>Por razones de seguridad, su tiempo de actividad ha finalizado. Por favor, vuelva a iniciar sesión para continuar.</p>
    
    <div class="modal-actions">
      <button class="btn-secondary" (click)="close()">Cancelar</button>
      <button class="btn-primary" (click)="relogin()">Iniciar Sesión de Nuevo</button>
    </div>
  </div>
</div>
