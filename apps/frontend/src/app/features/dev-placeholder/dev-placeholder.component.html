<div class="page-container">
  <!-- Barra Superior -->
  <header class="top-bar">
    <div class="brand">
      <span class="logo-icon"></span>
      <span class="logo-text">GastosApp</span>
    </div>
    <app-button variant="secondary" (onClick)="logout()">
      Cerrar Sesión
    </app-button>
  </header>

  <!-- Contenido Principal -->
  <main class="main-content">
    <app-card [glass]="true">
      <div class="placeholder-body">
        <div class="icon-glow"></div>
        <h1>Trabajo en Progreso</h1>
        <p>Estamos construyendo el panel de control principal. ¡Pronto estará disponible!</p>
      </div>
    </app-card>
  </main>

  <!-- Modal Oscurecido para Expiración de Sesión -->
  <div class="modal-overlay" *ngIf="showSessionModal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="warning-icon"></span>
        <h2>Su sesión ha expirado</h2>
      </div>
      <p>¿Desea extender su sesión para continuar trabajando sin perder los cambios?</p>
      
      <div class="modal-actions">
        <app-button 
          variant="primary" 
          [isLoading]="isExtending" 
          (onClick)="extendSession()">
          Extender sesión
        </app-button>
        
        <app-button 
          variant="secondary" 
          [disabled]="isExtending" 
          (onClick)="logout()">
          Cancelar
        </app-button>
      </div>
    </div>
  </div>
</div>
