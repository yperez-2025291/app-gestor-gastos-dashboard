<div class="auth-container">
  <div class="form-section">
    <div class="form-wrapper">
      <div class="header-text">
        <h1>Bienvenido de nuevo</h1>
        <p>Por favor ingresa tus credenciales para acceder</p>
      </div>

      <div class="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="ejemplo@correo.com" 
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="••••••••" 
            (keyup.enter)="onLogin()"
          />
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            <span>Recordar por 30 días</span>
          </label>
          <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="actions">
          <button type="button" class="btn-primary" (click)="onLogin()">
            Iniciar Sesión
          </button>

          <button type="button" class="btn-google" (click)="onGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Iniciar sesión con Google
          </button>
        </div>
      </div>

      <div class="signup-prompt">
        <span>¿No tienes una cuenta? </span>
        <a routerLink="/register" class="signup-link">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <div class="banner-section">
    <div class="banner-content">
      <div class="brand-badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>ZENITH CORE</span>
      </div>
      <h2>Control Financiero Inteligente</h2>
      <p>Visualiza, gestiona y optimiza tus finanzas personales con nuestro panel de análisis en tiempo real.</p>
    </div>
  </div>
</div>
