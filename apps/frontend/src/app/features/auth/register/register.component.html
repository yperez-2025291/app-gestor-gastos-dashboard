<div class="auth-container">
  <div class="form-section">
    <div class="form-wrapper">
      <div class="header-text">
        <h1>Crea tu cuenta</h1>
        <p>Completa tus datos para comenzar a gestionar tus finanzas</p>
      </div>

      <form (ngSubmit)="onRegister()" class="register-form">
        <div class="form-group">
          <label for="fullName">Nombre Completo</label>
          <input 
            type="text" 
            id="fullName" 
            [(ngModel)]="fullName" 
            name="fullName" 
            placeholder="Juan Pérez" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="ejemplo@correo.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="••••••••" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input 
            type="password" 
            id="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword" 
            placeholder="••••••••" 
            required 
          />
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms" required />
            <span>Acepto los términos y condiciones</span>
          </label>
        </div>

        <div class="actions">
          <button type="button" class="btn-primary" (click)="onRegister()">
            Crear Cuenta
          </button>
        </div>
      </form>

      <div class="login-prompt">
        <span>¿Ya tienes una cuenta? </span>
        <a routerLink="/login" class="login-link">Inicia sesión aquí</a>
      </div>
    </div>
  </div>

  <div class="banner-section">
    <div class="banner-content">
      <div class="brand-badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>ZENITH CORE</span>
      </div>
      <h2>Empieza a tomar el control hoy</h2>
      <p>Únete a nuestra plataforma y organiza tus egresos, presupuestos y metas de ahorro con total precisión.</p>
    </div>
  </div>
</div>
